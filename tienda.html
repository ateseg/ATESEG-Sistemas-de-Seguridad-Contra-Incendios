<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="google-site-verification" content="jyp6ZaygxgZt4-sO0wYrCVpJ88Ba2vD9zvsdiPAIdEk" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cotización de Productos | ATESEG</title>
<meta name="description" content="Arma tu lista de extintores, recargas y suministros y solicita tu cotización por WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#d22a12;--red-d:#a81d0a;--yel:#f5b800;--grn:#1b8a4b;
  --bg:#eceff1;--bg2:#e1e6e9;--card:#ffffff;--ink:#14181b;--muted:#566067;--line:#d5dbdf;
  --focus:#d22a12;--hdr:120px;
}
[data-theme="dark"]{
  --bg:#101315;--bg2:#20262a;--card:#181c1f;--ink:#eef1f3;--muted:#9aa4ab;--line:#2a3035;--focus:#f5b800;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--hdr) + 70px)}
html.lock{overflow:hidden}
body{font-family:'Barlow',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;transition:background .25s,color .25s;padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{font-family:'Barlow Condensed','Arial Narrow',sans-serif;line-height:1.05;font-weight:700}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* ---------- encabezado ---------- */
.hdr{position:sticky;top:0;z-index:30;background:#14181b;color:#fff;border-bottom:6px solid #14181b;--focus:#f5b800;transition:box-shadow .25s}
.hdr::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;background:repeating-linear-gradient(45deg,#f5b800 0 10px,#14181b 10px 20px);background-size:28.28px 100%;animation:franja 1.6s linear infinite}
.hdr.scrolled{box-shadow:0 8px 22px rgba(0,0,0,.3)}
.hdr.scrolled .hdr-in{padding-top:8px;padding-bottom:8px}
.hdr-in{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"brand search tools";gap:16px;align-items:center;padding-top:12px;padding-bottom:12px;transition:padding .25s ease}
.brand{grid-area:brand;display:flex;align-items:baseline;gap:10px;text-decoration:none;color:#fff}
.brand .back{font-size:1.1rem;opacity:.8}
.brand b{font-family:'Barlow Condensed',sans-serif;font-size:1.7rem;font-weight:800;letter-spacing:.02em}
.brand span{font-size:.95rem;opacity:.75}
.search{grid-area:search;position:relative;max-width:620px;width:100%;justify-self:center}
.search input{width:100%;height:46px;padding:0 16px 0 44px;border:0;border-radius:10px;background:#fff;color:#14181b;font-size:1rem}
.search input{transition:box-shadow .2s ease}
.search input:focus-visible{outline:none;box-shadow:0 0 0 3px #f5b800}
.search input::placeholder{color:#6b757c}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:#6b757c;fill:none;stroke-width:2.2;pointer-events:none}
.tools{grid-area:tools;display:flex;gap:8px}
.tbtn{height:46px;min-width:46px;padding:0 14px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600}
.tbtn:hover{background:rgba(255,255,255,.18)}
.tbtn.spin{animation:giro .5s ease}
.tbtn.cart{background:var(--red);border-color:var(--red)}
.tbtn.cart:hover{background:var(--red-d)}
.bump{animation:bump .4s ease}
.badge{background:#fff;color:var(--red);border-radius:999px;min-width:24px;height:24px;padding:0 7px;font-size:.85rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center}

/* ---------- introducción ---------- */
.intro{padding:30px 0 6px}
.intro h1{font-size:clamp(2.1rem,4.6vw,3.2rem);font-weight:800}
.intro p{margin-top:8px;color:var(--muted);max-width:62ch;font-size:1.05rem}
.intro h1,.intro p{animation:rise .6s ease both}
.intro p{animation-delay:.1s}

/* ---------- catálogo ---------- */
.shop{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px;padding:22px 0 60px;align-items:start}
.indice{position:sticky;top:calc(var(--hdr) + 18px);max-height:calc(100vh - var(--hdr) - 36px);overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.idx{transition:background .2s ease,border-color .2s ease;display:flex;justify-content:space-between;align-items:baseline;gap:10px;text-align:left;background:none;border:0;border-left:4px solid transparent;padding:9px 12px;cursor:pointer;border-radius:0 8px 8px 0;font-weight:500;color:var(--ink)}
.idx:hover{background:var(--bg2)}
.idx.on{border-left-color:var(--red);background:var(--card);font-weight:700}
.idx .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}
.idx.zero{opacity:.45}
.listhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.listhead h2{font-size:1.5rem}
.listhead span{color:var(--muted);font-size:.95rem}
.group{margin-bottom:34px}
.group>h2{font-size:1.9rem;margin:0 0 12px;display:flex;align-items:baseline;gap:10px}
.group>h2 small{font-family:'Barlow',sans-serif;font-size:.95rem;font-weight:500;color:var(--muted)}
.items{display:flex;flex-direction:column;gap:10px}

.item{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:18px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px 12px 12px;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.item:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.1);border-color:var(--ink)}
.item.rv{opacity:0;transform:translateY(18px);transition:opacity .5s ease,transform .5s ease}
.item.rv.in{opacity:1;transform:none}
.anim .group>h2{animation:rise .5s ease both}
.ph{width:120px;aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:linear-gradient(100deg,var(--bg2) 30%,var(--line) 50%,var(--bg2) 70%);background-size:200% 100%;animation:brillo 1.3s linear infinite}
.ph.ok{animation:none;background:var(--bg2)}
.thumb{width:100%;height:100%;object-fit:contain;display:block;opacity:0;transition:opacity .4s ease,transform .4s ease}
.thumb.ok{opacity:1}
.item:hover .thumb{transform:scale(1.07)}
.vuelo{position:fixed;z-index:200;pointer-events:none;border-radius:8px;background:#fff;box-shadow:0 8px 20px rgba(0,0,0,.3);object-fit:contain}
.body h3{font-size:1.35rem;margin-bottom:4px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;font-size:.88rem;color:var(--muted)}
.state{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink)}
.state::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--grn)}
.state.ask::before{background:var(--yel)}
.desc{font-size:.92rem;color:var(--muted);margin-top:6px;max-width:70ch}
.opts{border:0;margin-top:10px;min-width:0}
.opts legend{font-size:.85rem;font-weight:700;margin-bottom:6px;padding:0}
.opts.error legend{color:var(--red)}
.opts.error .chip span{border-color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;cursor:pointer}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-block;padding:6px 13px;border:1.5px solid var(--line);border-radius:999px;font-size:.9rem;font-weight:600;background:var(--card);transition:background .15s,color .15s,border-color .15s}
.chip:hover span{border-color:var(--ink)}
.chip input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink);animation:pop .28s ease}
.chip:active span{transform:scale(.94)}
.chip input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.act{display:flex;flex-direction:column;align-items:stretch;gap:6px;min-width:150px;text-align:center}
.incart{font-size:.82rem;font-weight:700;color:var(--grn)}
.add{background:var(--red);color:#fff;border:0;border-radius:8px;padding:12px 20px;font-weight:700;cursor:pointer;transition:background .15s,transform .12s,box-shadow .15s}
.add:hover{background:var(--red-d);transform:translateY(-1px);box-shadow:0 6px 14px rgba(210,42,18,.35)}
.add:active{transform:scale(.97)}
.add.done{background:var(--grn)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:46px 20px;text-align:center;color:var(--muted)}
.empty p{margin-bottom:14px}
.link{background:none;border:0;color:var(--red);text-decoration:underline;cursor:pointer;font-weight:600}
.foot{border-top:1px solid var(--line);padding:26px 0 90px;color:var(--muted);font-size:.95rem}
.foot a{color:var(--grn);font-weight:700}

/* ---------- lista de cotización ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,13,15,.55);z-index:90;opacity:0;visibility:hidden;transition:opacity .25s ease,visibility 0s .25s}
.overlay.open{opacity:1;visibility:visible;transition:opacity .25s ease}
.panel{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:440px;background:var(--card);color:var(--ink);z-index:100;display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform .28s ease,visibility 0s .28s;box-shadow:-8px 0 30px rgba(0,0,0,.25)}
.panel.open{transform:none;visibility:visible;transition:transform .28s ease}
.p-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line)}
.p-head h3{font-size:1.6rem}
.xbtn{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:1.1rem}
.xbtn:hover{background:var(--bg2)}
.p-body{flex:1;overflow-y:auto;padding:6px 20px}
.p-empty{text-align:center;color:var(--muted);margin-top:34px}
.line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.line h4{font-family:'Barlow Condensed',sans-serif;font-size:1.2rem;font-weight:700;line-height:1.1}
.line small{color:var(--muted)}
.panel.anim .line{animation:entra .38s ease both;animation-delay:calc(var(--i,0)*55ms)}
.cap{display:inline-block;background:var(--yel);color:#14181b;border-radius:4px;padding:1px 8px;font-weight:700;font-size:.82rem;margin:3px 6px 0 0}
.step{display:flex;align-items:center;gap:4px;margin-top:8px}
.step button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:700;font-size:1.1rem}
.step button:hover{background:var(--red);border-color:var(--red);color:#fff}
.step span{min-width:34px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.del{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.85rem}
.p-foot{padding:16px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
.sum{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700}
.form input{width:100%;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--card)}
.err{color:var(--red);font-weight:600;font-size:.9rem;min-height:1.3em;margin-bottom:6px}
.send{width:100%;height:50px;border:0;border-radius:10px;background:var(--grn);color:#fff;font-weight:700;font-size:1.02rem;cursor:pointer}
.send:hover{filter:brightness(1.08)}
.bar{display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:60;background:var(--red);color:#fff;border:0;border-radius:12px;padding:15px 18px;font-weight:700;cursor:pointer;justify-content:space-between;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);background:#14181b;color:#fff;padding:11px 18px;border-radius:999px;font-weight:600;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:120;max-width:92%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- celular y tablet ---------- */
@media (max-width:900px){
  .hdr-in{grid-template-columns:1fr auto;grid-template-areas:"brand tools" "search search";gap:10px 12px}
  .search{max-width:none;justify-self:stretch}
  .tbtn.cart .txt{display:none}
  .shop{grid-template-columns:1fr;gap:0;padding-top:0}
  .indice{position:sticky;top:var(--hdr);z-index:20;flex-direction:row;overflow-x:auto;overflow-y:hidden;max-height:none;gap:8px;margin:0 -20px;padding:10px 20px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
  .indice::-webkit-scrollbar{display:none}
  .idx{flex:0 0 auto;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;background:var(--card);white-space:nowrap}
  .idx.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .idx.on .n{color:inherit;opacity:.8}
  .listhead{margin-top:16px}
  .bar{display:flex;transform:translateY(170%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s .35s}
  .bar.show{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
  .toast{bottom:90px}
  .panel{max-width:none;top:auto;height:92%;border-radius:18px 18px 0 0;transform:translateY(100%)}
  .panel.open{transform:none}
}
@media (max-width:620px){
  .wrap{padding:0 14px}
  .indice{margin:0 -14px;padding:10px 14px}
  .brand span{display:none}
  .item{grid-template-columns:92px minmax(0,1fr);gap:12px;align-items:start;padding:10px}
  .ph{width:92px}
  .body h3{font-size:1.2rem}
  .act{grid-column:1/-1;flex-direction:row-reverse;justify-content:space-between;align-items:center;min-width:0}
  .act .add{flex:1}
  .incart{flex:0 0 auto;text-align:left}
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes brillo{to{background-position:-200% 0}}
@keyframes franja{to{background-position-x:28.28px}}
@keyframes pop{50%{transform:scale(1.12)}}
@keyframes bump{40%{transform:scale(1.4)}}
@keyframes giro{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body data-theme="light">

<header class="hdr" id="hdr"><div class="wrap hdr-in">
  <a class="brand" href="index.html" aria-label="Volver al portal ATESEG"><span class="back" aria-hidden="true">←</span><b>ATESEG</b><span>Tienda</span></a>
  <div class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input type="search" id="searchProd" placeholder="Buscar por nombre o código" aria-label="Buscar productos" autocomplete="off">
  </div>
  <div class="tools">
    <button class="tbtn" id="themeBtn" type="button" aria-label="Cambiar modo claro u oscuro">🌙</button>
    <button class="tbtn cart" id="cartBtn" type="button" aria-controls="cartPanel">🛒 <span class="txt">Mi lista</span> <span class="badge" id="cartCount">0</span></button>
  </div>
</div></header>

<main class="wrap">
  <section class="intro">
    <h1>Cotiza tus productos</h1>
    <p>Selecciona los productos para tu cotización en Santo Domingo. Arma tu lista y envíala por WhatsApp.</p>
  </section>

  <div class="shop">
    <nav class="indice" id="indice" aria-label="Categorías"></nav>
    <section>
      <div class="listhead"><h2 id="listTitle">Todos los productos</h2><span id="resultCount" aria-live="polite"></span></div>
      <div id="contenedorSecciones"></div>
    </section>
  </div>
</main>

<footer class="foot"><div class="wrap">¿No encuentras un producto? <a id="waLink" href="#" target="_blank" rel="noopener">Escríbenos por WhatsApp</a></div></footer>

<button class="bar" id="bar" type="button"><span>Ver mi lista</span><span id="barTotal">0 productos</span></button>

<div class="overlay" id="cartOverlay"></div>
<aside class="panel" id="cartPanel" role="dialog" aria-modal="true" aria-labelledby="cartTitle" aria-hidden="true">
  <div class="p-head">
    <h3 id="cartTitle">Tu lista de cotización</h3>
    <button class="xbtn" id="cartClose" type="button" aria-label="Cerrar lista">✕</button>

      <input type="text" id="clientName" placeholder="Tu nombre o empresa *" autocomplete="name" aria-required="true">
      <input type="tel" id="clientPhone" placeholder="Teléfono de contacto *" autocomplete="tel" inputmode="tel" aria-required="true">
      <input type="text" id="clientRuc" placeholder="RUC o cédula (opcional)" inputmode="numeric">

      <input type="text" id="clientAddress" placeholder="Ciudad / dirección (opcional)" autocomplete="street-address">
    </div>
    <div class="err" id="formError" role="alert"></div>
    <button class="send" id="sendBtn" type="button">Enviar cotización por WhatsApp</button>
  </div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="productos.js"></script>
<script>
(function(){
'use strict';

const WHATSAPP = '593980677550';
const KEY_CARRITO = 'ateseg_cotizacion';
const KEY_TEMA = 'ateseg_tema';
// Dónde están las fotos: '' = junto a tienda.html (raíz del repositorio). Si algún día las pasas a una carpeta, escribe 'fotos/'.
const RUTA_FOTOS = '';
// Orden y nombre visible de cada categoría. Una categoría que no esté aquí también se muestra, al final.
const NOMBRES = {
  'RECARGAS': 'Recargas',
  'VENTAS': 'Ventas',
  'EXTINTORES': 'Extintores',
  'SUMINISTROS': 'Suministros',
  'REPUESTOS DE EXTINTOR': 'Repuestos de extintor',
  'DETECTORES Y ALARMAS': 'Detectores y alarmas',
  'ILUMINACIÓN DE EMERGENCIA': 'Iluminación de emergencia',
  'BOTIQUINES Y PRIMEROS AUXILIOS': 'Botiquines y primeros auxilios',
  'SEÑALIZACIÓN Y SEGURIDAD VIAL': 'Señalización y seguridad vial',
  'TUBERÍA Y ACCESORIOS CONTRA INCENDIO': 'Tubería y accesorios contra incendio',
  'GABINETES Y CAJAS': 'Gabinetes y cajas',
  'HERRAMIENTAS': 'Herramientas'
};
const $ = id => document.getElementById(id);

/* ---------- utilidades ---------- */
function esc(v){
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function norm(v){
  return String(v == null ? '' : v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}
function nombreCat(k){ return NOMBRES[k] || (k.charAt(0) + k.slice(1).toLowerCase()); }
function ordenar(cats){
  const orden = Object.keys(NOMBRES);
  return cats.slice().sort((a, b) => {
    const ia = orden.indexOf(a), ib = orden.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
  });
}
function leerCarrito(){
  try {
    const d = JSON.parse(localStorage.getItem(KEY_CARRITO));
    return Array.isArray(d) ? d : [];
  } catch(e){ return []; }
}
function guardarCarrito(){
  try { localStorage.setItem(KEY_CARRITO, JSON.stringify(carrito)); } catch(e){}
}

/* ---------- datos ---------- */
const catalogo = (typeof productos !== 'undefined' && Array.isArray(productos))
  ? productos.filter(p => p && p.codigo && p.nombre)
             .map(p => Object.assign({}, p, { categoria: String(p.categoria || 'OTROS').trim().toUpperCase() }))
  : [];
const porCodigo = new Map(catalogo.map(p => [p.codigo, p]));
const categorias = ordenar([...new Set(catalogo.map(p => p.categoria))]);

function opcionValida(p, opcion){
  if (!p.opciones || !p.opciones.length) return true;   // producto sin variantes
  return p.opciones.includes(opcion);                   // con variantes: debe haber una elegida
}
// El carrito guarda solo código, opción y cantidad; el resto se toma siempre del catálogo actual.
let carrito = leerCarrito()
  .filter(i => i && porCodigo.has(i.codigo) && Number(i.cantidad) > 0 && opcionValida(porCodigo.get(i.codigo), i.opcion))
  .map(i => ({ codigo: i.codigo, opcion: i.opcion || '', cantidad: Math.min(999, Math.floor(Number(i.cantidad))) }));
const mismo = (i, cod, opc) => i.codigo === cod && (i.opcion || '') === (opc || '');
const titulo = i => porCodigo.get(i.codigo).nombre + (i.opcion ? ' – ' + i.opcion : '');

let catActual = '';

/* ---------- tema y medidas ---------- */
function aplicarTema(t){
  document.body.setAttribute('data-theme', t);
  $('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
}
function cambiarTema(){
  const t = document.body.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  aplicarTema(t);
  try { localStorage.setItem(KEY_TEMA, t); } catch(e){}
  const b = $('themeBtn');
  b.classList.remove('spin'); void b.offsetWidth; b.classList.add('spin');
}
function medirEncabezado(){
  document.documentElement.style.setProperty('--hdr', $('hdr').offsetHeight + 'px');
}

/* ---------- catálogo ---------- */
function renderIndice(cuentas, total){
  const ind = $('indice');
  ind.innerHTML = `<button class="idx ${catActual ? '' : 'on'}" type="button" data-cat="" aria-pressed="${catActual ? 'false' : 'true'}">Todos <span class="n">${total}</span></button>` +
    categorias.map(c => {
      const n = cuentas.get(c) || 0;
      return `<button class="idx ${catActual === c ? 'on' : ''} ${n ? '' : 'zero'}" type="button" data-cat="${esc(c)}" aria-pressed="${catActual === c ? 'true' : 'false'}">${esc(nombreCat(c))} <span class="n">${n}</span></button>`;
    }).join('');
  const on = ind.querySelector('.on');
  if (on && ind.scrollWidth > ind.clientWidth && window.innerWidth <= 900) {
    ind.scrollLeft = on.offsetLeft - (ind.clientWidth - on.clientWidth) / 2;
  }
}

function selectorOpciones(p){
  if (!p.opciones || !p.opciones.length) return '';
  return `<fieldset class="opts">
    <legend>${esc(p.opcionesTitulo || 'Elige una opción')} *</legend>
    <div class="chips">${p.opciones.map(o =>
      `<label class="chip"><input type="radio" name="op-${esc(p.codigo)}" value="${esc(o)}"><span>${esc(o)}</span></label>`
    ).join('')}</div>
  </fieldset>`;
}

function fila(p){
  const stock = Number(p.stock) || 0;
  let estado = '';
  if (p.categoria !== 'RECARGAS') {
    estado = stock > 0 ? '<span class="state">Disponible</span>' : '<span class="state ask">Consultar disponibilidad</span>';
  }
  return `<article class="item">
    <div class="ph"><img class="thumb" src="${RUTA_FOTOS}${encodeURIComponent(p.codigo)}.jpg" alt="${esc(p.nombre)}" loading="lazy" width="120" height="90"></div>
    <div class="body">
      <h3>${esc(p.nombre)}</h3>
      <div class="meta">${estado}<span>Código ${esc(p.codigo)}</span></div>
      ${p.descripcion ? `<p class="desc">${esc(p.descripcion)}</p>` : ''}
      ${selectorOpciones(p)}
    </div>
    <div class="act">
      <span class="incart" data-incart="${esc(p.codigo)}" hidden></span>
      <button class="add js-add" type="button" data-codigo="${esc(p.codigo)}">Añadir</button>
    </div>
  </article>`;
}

function renderProductos(animar){
  // Cada palabra escrita debe aparecer en el nombre, código o descripción (en cualquier orden).
  const palabras = norm($('searchProd').value.trim()).split(/\s+/).filter(Boolean);
  const base = catalogo.filter(p => {
    const texto = norm(p.nombre + ' ' + p.codigo + ' ' + (p.descripcion || ''));
    return palabras.every(w => texto.includes(w));
  });
  const cuentas = new Map();
  base.forEach(p => cuentas.set(p.categoria, (cuentas.get(p.categoria) || 0) + 1));
  renderIndice(cuentas, base.length);

  const lista = catActual ? base.filter(p => p.categoria === catActual) : base;
  const cont = $('contenedorSecciones');
  $('listTitle').textContent = catActual ? nombreCat(catActual) : 'Todos los productos';
  $('resultCount').textContent = lista.length + (lista.length === 1 ? ' producto' : ' productos');

  if (!catalogo.length) {
    cont.innerHTML = '<div class="empty"><p>No se pudo cargar el catálogo. Recarga la página o escríbenos por WhatsApp.</p></div>';
    $('resultCount').textContent = '';
    return;
  }
  if (!lista.length) {
    cont.innerHTML = '<div class="empty"><p>No encontramos productos con esa búsqueda. Prueba con otra palabra o escríbenos por WhatsApp.</p><button class="link" type="button" data-accion="limpiar">Quitar búsqueda y filtros</button></div>';
    return;
  }

  const grupos = new Map();
  lista.forEach(p => {
    if (!grupos.has(p.categoria)) grupos.set(p.categoria, []);
    grupos.get(p.categoria).push(p);
  });
  cont.innerHTML = ordenar([...grupos.keys()]).map(k => {
    const items = grupos.get(k);
    const cabecera = catActual ? '' : `<h2>${esc(nombreCat(k))} <small>${items.length}</small></h2>`;
    return `<div class="group">${cabecera}<div class="items">${items.map(fila).join('')}</div></div>`;
  }).join('');
  marcarEnLista();
  revelar(animar);
}

/* ---------- animaciones ---------- */
const reducir = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
let obs = null;
let listo = false;

// Las filas aparecen una a una al llegar a la pantalla. Al escribir en el buscador no se anima, para no parpadear.
function revelar(animar){
  const cont = $('contenedorSecciones');
  cont.classList.toggle('anim', !!animar);
  cont.querySelectorAll('img.thumb').forEach(i => {
    if (i.complete && i.naturalWidth) { i.classList.add('ok'); i.parentNode.classList.add('ok'); }
  });
  if (obs) { obs.disconnect(); obs = null; }
  if (!animar || reducir || !('IntersectionObserver' in window)) return;
  const filas = cont.querySelectorAll('.item');
  filas.forEach(f => f.classList.add('rv'));
  obs = new IntersectionObserver(entradas => {
    let n = 0;
    entradas.forEach(en => {
      if (!en.isIntersecting) return;
      const f = en.target;
      f.style.transitionDelay = (Math.min(n, 6) * 60) + 'ms';
      n++;
      requestAnimationFrame(() => f.classList.add('in'));
      obs.unobserve(f);
      setTimeout(() => { f.classList.remove('rv', 'in'); f.style.transitionDelay = ''; }, 900);
    });
  }, { rootMargin: '0px 0px -6% 0px', threshold: 0.05 });
  filas.forEach(f => obs.observe(f));
}

function rebotar(el){
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
}

// La foto del producto "vuela" hacia el carrito (o hacia la barra roja en celular).
function volar(btn, haciaBarra){
  if (reducir) return;
  const img = btn.closest('.item').querySelector('.thumb');
  const destino = haciaBarra ? $('bar') : $('cartBtn');
  if (!img || !img.animate) return;
  const a = img.getBoundingClientRect(), b = destino.getBoundingClientRect();
  const c = img.cloneNode();
  c.removeAttribute('loading'); c.className = 'vuelo';
  c.style.left = a.left + 'px'; c.style.top = a.top + 'px'; c.style.width = a.width + 'px'; c.style.height = a.height + 'px';
  document.body.appendChild(c);
  const dx = (b.left + b.width / 2) - (a.left + a.width / 2), dy = (b.top + b.height / 2) - (a.top + a.height / 2);
  const an = c.animate([
    { transform: 'translate(0,0) scale(1)', opacity: .95 },
    { transform: 'translate(' + (dx * .6) + 'px,' + (dy * .35 - 60) + 'px) scale(.6)', opacity: .9, offset: .55 },
    { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.1)', opacity: .2 }
  ], { duration: 650, easing: 'cubic-bezier(.5,0,.75,.4)' });
  an.onfinish = () => c.remove();
}

/* ---------- carrito ---------- */
function totalUnidades(){ return carrito.reduce((s, i) => s + i.cantidad, 0); }

function marcarEnLista(){
  document.querySelectorAll('[data-incart]').forEach(el => {
    const q = carrito.filter(i => i.codigo === el.dataset.incart).reduce((s, i) => s + i.cantidad, 0);
    el.hidden = !q;
    el.textContent = q ? 'En tu lista: ' + q : '';
  });
}

function actualizarBarra(){
  const total = totalUnidades();
  const abierto = $('cartPanel').classList.contains('open');
  $('barTotal').textContent = total + (total === 1 ? ' producto' : ' productos');
  $('bar').classList.toggle('show', total > 0 && !abierto);
}

function actualizarCarritoUI(){
  const total = totalUnidades();
  const txt = total + (total === 1 ? ' producto' : ' productos');
  const antes = parseInt($('cartCount').textContent, 10) || 0;
  $('cartCount').textContent = total;
  if (listo && total > antes) rebotar($('cartCount'));
  $('cartTotal').textContent = txt;
  $('cartClear').style.display = carrito.length ? '' : 'none';

  const lista = $('cartItemsList');
  if (!carrito.length) {
    lista.innerHTML = '<p class="p-empty">Tu lista está vacía.<br>Toca «Añadir» en los productos que necesites.</p>';
  } else {
    lista.innerHTML = carrito.map((i, n) => {
      const p = porCodigo.get(i.codigo);
      const d = `data-codigo="${esc(i.codigo)}" data-opcion="${esc(i.opcion)}"`;
      return `<div class="line" style="--i:${n}">
        <div>
          <h4>${esc(p.nombre)}</h4>
          ${i.opcion ? `<span class="cap">${esc(i.opcion)}</span>` : ''}<small>${esc(p.codigo)}</small>
          <div class="step">
            <button type="button" data-accion="menos" ${d} aria-label="Quitar una unidad de ${esc(titulo(i))}">−</button>
            <span aria-live="polite">${i.cantidad}</span>
            <button type="button" data-accion="mas" ${d} aria-label="Agregar una unidad de ${esc(titulo(i))}">+</button>
          </div>
        </div>
        <button class="del" type="button" data-accion="quitar" ${d} aria-label="Eliminar ${esc(titulo(i))}">Eliminar</button>
      </div>`;
    }).join('');
  }
  marcarEnLista();
  actualizarBarra();
}

function persistir(){ guardarCarrito(); actualizarCarritoUI(); }

function cambiarCantidad(codigo, opcion, delta){
  const item = carrito.find(i => mismo(i, codigo, opcion));
  if (!item) return;
  item.cantidad = Math.min(999, item.cantidad + delta);
  if (item.cantidad <= 0) carrito = carrito.filter(i => i !== item);
  persistir();
}

function agregar(codigo, opcion){
  const p = porCodigo.get(codigo);
  if (!p) return;
  const item = carrito.find(i => mismo(i, codigo, opcion));
  if (item) item.cantidad = Math.min(999, item.cantidad + 1);
  else carrito.push({ codigo: codigo, opcion: opcion || '', cantidad: 1 });
  persistir();
  aviso(titulo({ codigo: codigo, opcion: opcion }) + ' añadido a tu lista');
}

let toastTimer;
function aviso(texto){
  const t = $('toast');
  t.textContent = texto;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

let ultimoFoco = null;
function abrirCarrito(){
  ultimoFoco = document.activeElement;
  $('cartPanel').classList.add('open', 'anim');
  setTimeout(() => $('cartPanel').classList.remove('anim'), 900);
  $('cartPanel').setAttribute('aria-hidden', 'false');
  $('cartOverlay').classList.add('open');
  document.documentElement.classList.add('lock');
  actualizarBarra();
  $('cartClose').focus();
}
function cerrarCarrito(){
  $('cartPanel').classList.remove('open');
  $('cartPanel').setAttribute('aria-hidden', 'true');
  $('cartOverlay').classList.remove('open');
  document.documentElement.classList.remove('lock');
  actualizarBarra();
  if (ultimoFoco && ultimoFoco.focus) ultimoFoco.focus();
}

/* ---------- envío por WhatsApp ---------- */
function enviarCotizacion(){
  const err = $('formError');
  err.textContent = '';
  if (!carrito.length) { err.textContent = 'Agrega al menos un producto a tu lista.'; return; }

  const nombre = $('clientName').value.trim();
  const telefono = $('clientPhone').value.trim();
  const ruc = $('clientRuc').value.trim();
  const correo = $('clientEmail').value.trim();
  const direccion = $('clientAddress').value.trim();

  if (!nombre) { err.textContent = 'Escribe tu nombre o el de tu empresa.'; $('clientName').focus(); return; }
  if (!/\d{7,}/.test(telefono.replace(/[\s\-().+]/g, ''))) { err.textContent = 'Escribe un teléfono válido para contactarte.'; $('clientPhone').focus(); return; }
  if (correo && !$('clientEmail').checkValidity()) { err.textContent = 'El correo no parece válido. Revísalo o déjalo vacío.'; $('clientEmail').focus(); return; }

  const lineas = ['*SOLICITUD DE COTIZACIÓN - ATESEG*', '-----------------------------------',
    '*Cliente / Empresa:* ' + nombre,
    '*Teléfono:* ' + telefono];
  if (ruc) lineas.push('*RUC / Cédula:* ' + ruc);
  if (correo) lineas.push('*Correo:* ' + correo);
  if (direccion) lineas.push('*Ubicación:* ' + direccion);
  lineas.push('-----------------------------------', '*DETALLE DE PRODUCTOS:*');
  carrito.forEach(i => {
    lineas.push('- ' + i.cantidad + 'x ' + titulo(i) + ' (' + i.codigo + ')');
  });
  if (carrito.some(i => /^otra/i.test(i.opcion))) lineas.push('_Indicaré la capacidad de los equipos marcados como "Otra capacidad" en este chat._');
  lineas.push('*Total de unidades:* ' + totalUnidades());

  const url = 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(lineas.join('\n'));
  window.open(url, '_blank', 'noopener');
}

/* ---------- eventos ---------- */
function iniciar(){
  let tema = 'light';
  try { tema = localStorage.getItem(KEY_TEMA) === 'dark' ? 'dark' : 'light'; } catch(e){}
  aplicarTema(tema);
  $('waLink').href = 'https://wa.me/' + WHATSAPP;

  const hdr = $('hdr');
  medirEncabezado();
  window.addEventListener('resize', medirEncabezado);
  if ('ResizeObserver' in window) new ResizeObserver(medirEncabezado).observe(hdr);
  const marcarScroll = () => hdr.classList.toggle('scrolled', window.scrollY > 12);
  window.addEventListener('scroll', marcarScroll, { passive: true });
  marcarScroll();
  renderProductos(true);
  actualizarCarritoUI();
  listo = true;

  $('themeBtn').addEventListener('click', cambiarTema);
  $('cartBtn').addEventListener('click', abrirCarrito);
  $('bar').addEventListener('click', abrirCarrito);
  $('cartClose').addEventListener('click', cerrarCarrito);
  $('cartOverlay').addEventListener('click', cerrarCarrito);
  $('sendBtn').addEventListener('click', enviarCotizacion);
  $('cartClear').addEventListener('click', () => {
    if (confirm('¿Vaciar toda tu lista de cotización?')) { carrito = []; persistir(); }
  });
  $('searchProd').addEventListener('input', () => renderProductos(false));

  $('indice').addEventListener('click', e => {
    const b = e.target.closest('.idx');
    if (!b) return;
    catActual = b.dataset.cat;
    renderProductos(true);
    if (window.innerWidth > 900) window.scrollTo({ top: 0 });
  });

  const cont = $('contenedorSecciones');
  cont.addEventListener('click', e => {
    const lim = e.target.closest('[data-accion="limpiar"]');
    if (lim) { $('searchProd').value = ''; catActual = ''; renderProductos(true); return; }

    const b = e.target.closest('.js-add');
    if (!b) return;
    const grupo = b.closest('.item').querySelector('.opts');
    let opcion = '';
    if (grupo) {
      const sel = grupo.querySelector('input:checked');
      if (!sel) {
        grupo.classList.add('error');
        grupo.scrollIntoView({ block: 'center', behavior: 'smooth' });
        aviso('Elige primero: ' + (porCodigo.get(b.dataset.codigo).opcionesTitulo || 'una opción'));
        return;
      }
      opcion = sel.value;
    }
    const barraVisible = $('bar').classList.contains('show');
    agregar(b.dataset.codigo, opcion);
    volar(b, barraVisible);
    b.textContent = 'Añadido ✓';
    b.classList.add('done');
    setTimeout(() => { b.textContent = 'Añadir'; b.classList.remove('done'); }, 1000);
  });
  cont.addEventListener('change', e => {
    const g = e.target.closest('.opts');
    if (g) g.classList.remove('error');
  });
  // Si una foto no existe, se muestra el logo (una sola vez, sin bucles).
  cont.addEventListener('error', e => {
    const img = e.target;
    if (img.tagName !== 'IMG') return;
    if (!img.dataset.fallback) {
      img.dataset.fallback = '1';
      img.src = 'logo-ateseg.jpg';
    } else {
      img.parentNode.classList.add('ok');   // ni el logo existe: se detiene el brillo de carga
    }
  }, true);
  // La foto aparece suavemente cuando termina de cargar.
  cont.addEventListener('load', e => {
    if (e.target.tagName === 'IMG') { e.target.classList.add('ok'); e.target.parentNode.classList.add('ok'); }
  }, true);

  $('cartItemsList').addEventListener('click', e => {
    const b = e.target.closest('[data-accion]');
    if (!b) return;
    const cod = b.dataset.codigo, opc = b.dataset.opcion;
    if (b.dataset.accion === 'mas') cambiarCantidad(cod, opc, 1);
    else if (b.dataset.accion === 'menos') cambiarCantidad(cod, opc, -1);
    else if (b.dataset.accion === 'quitar') {
      carrito = carrito.filter(i => !mismo(i, cod, opc));
      persistir();
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && $('cartPanel').classList.contains('open')) cerrarCarrito();
  });
}

document.addEventListener('DOMContentLoaded', iniciar);
})();
</script>
