<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cotización de Productos | ATESEG</title>
<meta name="description" content="Arma tu lista de extintores, recargas y suministros y solicita tu cotización por WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--red:#d22a12;--red-d:#a81d0a;--ink:#1a1412;--yel:#f5b800;--bg:#fafaf8;--bg2:#efedea;--grn:#1b8a4b;--line:#d9d5d0}
[data-theme="dark"]{--bg:#12100e;--bg2:#1c1917;--ink:#f5f5f4;--line:#292524;--bg-card:#1c1917}
[data-theme="light"]{--bg-card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{font-family:'Barlow',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;transition:background .3s,color .3s}
h1,h2,h3,.cond{font-family:'Barlow Condensed','Arial Narrow',sans-serif;line-height:1.05}
a{color:inherit}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.wrap{max-width:1150px;margin:0 auto;padding:0 20px}
.top{background:#1a1412;color:#fff;font-size:.85rem;text-align:center;padding:6px 10px}
.top b{color:var(--yel)}
nav{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.1)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:70px;gap:10px}
.nav-brand{font-family:'Barlow Condensed',sans-serif;font-size:1.4rem;font-weight:800;text-decoration:none;color:var(--red)}
.tools-nav{display:flex;gap:10px;align-items:center}
.theme-btn,.cart-btn{background:var(--bg2);border:1px solid var(--line);padding:8px 12px;border-radius:6px;cursor:pointer;font:inherit;font-weight:600;font-size:.9rem;color:inherit;display:inline-flex;align-items:center;gap:6px}
.theme-btn:hover,.cart-btn:hover{background:var(--red);color:#fff;border-color:var(--red)}
.cart-badge{background:var(--red);color:#fff;border-radius:999px;padding:1px 7px;font-size:.75rem;min-width:22px;text-align:center}
.cart-btn:hover .cart-badge{background:#fff;color:var(--red)}
.shop-header{padding:40px 0 20px;text-align:center}
.shop-header h1{font-size:clamp(2.2rem,5vw,3.2rem);font-weight:800;text-transform:uppercase;margin-bottom:10px}
.filters-bar{display:flex;gap:15px;margin-bottom:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.search-input{width:100%;max-width:400px;padding:12px 16px;font:inherit;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:inherit}
.cat-select{padding:12px 16px;font:inherit;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:inherit;cursor:pointer}
.result-count{text-align:center;font-size:.9rem;opacity:.7;margin-bottom:10px;min-height:1.4em}
.section-title{font-size:2rem;font-weight:800;text-transform:uppercase;margin:30px 0 20px;color:var(--red);border-bottom:2px solid var(--line);padding-bottom:8px}
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;margin-bottom:20px}
.product-card{background:var(--bg-card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.product-card img{width:100%;height:180px;object-fit:contain;background:var(--bg2);border-radius:6px;padding:10px;margin-bottom:10px}
.product-info h3{font-size:1.25rem;font-weight:700;margin:2px 0 6px}
.product-cat{font-size:.8rem;text-transform:uppercase;color:var(--red);font-weight:700}
.product-desc{font-size:.92rem;opacity:.85;margin:6px 0}
.stock{display:inline-block;font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:999px;margin-top:4px}
.stock.ok{background:rgba(27,138,75,.15);color:var(--grn)}
.stock.ask{background:rgba(245,184,0,.2)}
.empty{text-align:center;padding:50px 10px;opacity:.75}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:8px;font:inherit;font-weight:600;text-decoration:none;border:2px solid transparent;font-size:.95rem;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.btn-r{background:var(--red);color:#fff}
.btn-g{background:var(--grn);color:#fff}
.btn-outline{background:transparent;border-color:var(--line);color:inherit}
.btn-block{width:100%}
.cart-modal{position:fixed;top:0;right:-100%;width:100%;max-width:420px;height:100%;background:var(--bg);border-left:1px solid var(--line);z-index:100;box-shadow:-5px 0 25px rgba(0,0,0,.2);transition:right .3s ease,visibility 0s .3s;display:flex;flex-direction:column;visibility:hidden}
.cart-modal.open{right:0;visibility:visible;transition:right .3s ease}
.cart-header{padding:20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.cart-body{padding:20px;overflow-y:auto;flex-grow:1}
.cart-empty{text-align:center;opacity:.6;margin-top:20px}
.cart-item{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;padding-bottom:15px;border-bottom:1px solid var(--line);gap:10px}
.cart-item-details h4{font-size:.95rem;font-weight:600}
.cart-item-details small{opacity:.65}
.qty-controls{display:flex;align-items:center;gap:8px;margin-top:6px}
.qty-btn{background:var(--bg2);border:1px solid var(--line);width:30px;height:30px;border-radius:4px;cursor:pointer;font:inherit;font-weight:700;color:inherit}
.qty-btn:hover{background:var(--red);color:#fff;border-color:var(--red)}
.cart-footer{padding:20px;border-top:1px solid var(--line);background:var(--bg2)}
.cart-summary{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:12px}
.link-btn{background:none;border:none;color:inherit;opacity:.7;text-decoration:underline;cursor:pointer;font:inherit;font-size:.85rem}
.checkout-form input{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;margin-bottom:10px;background:var(--bg);color:inherit;font:inherit}
.form-error{color:var(--red);font-weight:600;font-size:.9rem;margin-bottom:8px;min-height:1.2em}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;display:none}
.overlay.open{display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#1a1412;color:#fff;padding:10px 18px;border-radius:999px;font-size:.9rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:120;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:520px){.hide-sm{display:none}.nav-brand{font-size:1.2rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body data-theme="light">

<div class="top">Selecciona los productos para tu cotización en <b>Santo Domingo</b>.</div>

<nav><div class="wrap">
  <a class="nav-brand" href="index.html">← Volver<span class="hide-sm"> al Portal ATESEG</span></a>
  <div class="tools-nav">
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Cambiar modo claro u oscuro">🌙</button>
    <button class="cart-btn" id="cartBtn" type="button" aria-controls="cartModal">🛒 Cotización <span id="cartCount" class="cart-badge">0</span></button>
  </div>
</div></nav>

<main class="wrap">
  <header class="shop-header">
    <h1>Catálogo para Cotización</h1>
    <p>Arma tu lista de productos de ventas, recargas y suministros.</p>
  </header>

  <div class="filters-bar">
    <input type="search" id="searchProd" class="search-input" placeholder="Buscar por nombre o código..." aria-label="Buscar productos">
    <select id="catSelect" class="cat-select" aria-label="Filtrar por categoría">
      <option value="">Todas las categorías</option>
    </select>
  </div>
  <p class="result-count" id="resultCount" aria-live="polite"></p>

  <div id="contenedorSecciones"></div>
</main>

<div id="cartOverlay" class="overlay"></div>
<aside id="cartModal" class="cart-modal" role="dialog" aria-modal="true" aria-labelledby="cartTitle" aria-hidden="true">
  <div class="cart-header">
    <h3 id="cartTitle">Tu lista de cotización</h3>
    <button class="btn btn-outline" id="cartClose" type="button" style="padding:4px 10px" aria-label="Cerrar lista">✕</button>
  </div>
  <div class="cart-body" id="cartItemsList"></div>
  <div class="cart-footer">
    <div class="cart-summary"><span id="cartTotal">0 productos</span><button class="link-btn" id="cartClear" type="button">Vaciar lista</button></div>
    <div class="checkout-form">
      <input type="text" id="clientName" placeholder="Tu nombre o empresa *" autocomplete="name" aria-required="true">
      <input type="tel" id="clientPhone" placeholder="Teléfono de contacto *" autocomplete="tel" inputmode="tel" aria-required="true">
      <input type="text" id="clientRuc" placeholder="RUC o cédula (opcional)" inputmode="numeric">
      <input type="email" id="clientEmail" placeholder="Correo (opcional)" autocomplete="email">
      <input type="text" id="clientAddress" placeholder="Ciudad / dirección (opcional)" autocomplete="street-address">
    </div>
    <div class="form-error" id="formError" role="alert"></div>
    <button class="btn btn-g btn-block" id="sendBtn" type="button">Enviar cotización por WhatsApp 📲</button>
  </div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="productos.js"></script>
<script>
(function(){
'use strict';

const WHATSAPP = '593988257080';
const KEY_CARRITO = 'ateseg_cotizacion';
const KEY_TEMA = 'ateseg_tema';
// Orden y título de cada sección. Una categoría que no esté aquí también se muestra, al final.
const SECCIONES = {
  'VENTAS': '🛒 VENTAS',
  'EXTINTORES': '🧯 EXTINTORES',
  'RECARGAS': '🔄 RECARGAS',
  'SUMINISTROS': '🦺 SUMINISTROS',
  'REPUESTOS DE EXTINTOR': '🔧 REPUESTOS DE EXTINTOR',
  'DETECTORES Y ALARMAS': '🚨 DETECTORES Y ALARMAS',
  'ILUMINACIÓN DE EMERGENCIA': '💡 ILUMINACIÓN DE EMERGENCIA',
  'BOTIQUINES Y PRIMEROS AUXILIOS': '🩹 BOTIQUINES Y PRIMEROS AUXILIOS',
  'SEÑALIZACIÓN Y SEGURIDAD VIAL': '🚧 SEÑALIZACIÓN Y SEGURIDAD VIAL',
  'TUBERÍA Y ACCESORIOS CONTRA INCENDIO': '🔩 TUBERÍA Y ACCESORIOS CONTRA INCENDIO',
  'GABINETES Y CAJAS': '🗄️ GABINETES Y CAJAS',
  'HERRAMIENTAS': '🔨 HERRAMIENTAS'
};
const $ = id => document.getElementById(id);

/* ---------- utilidades ---------- */
function esc(v){
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function norm(v){
  return String(v == null ? '' : v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}
function leerCarrito(){
  try {
    const d = JSON.parse(localStorage.getItem(KEY_CARRITO));
    return Array.isArray(d) ? d : [];
  } catch(e){ return []; }
}
function guardarCarrito(){
  try { localStorage.setItem(KEY_CARRITO, JSON.stringify(carrito)); } catch(e){}
}

/* ---------- datos ---------- */
const catalogo = (typeof productos !== 'undefined' && Array.isArray(productos))
  ? productos.filter(p => p && p.codigo && p.nombre)
             .map(p => Object.assign({}, p, { categoria: String(p.categoria || 'OTROS').trim().toUpperCase() }))
  : [];
const porCodigo = new Map(catalogo.map(p => [p.codigo, p]));

// El carrito guarda solo código y cantidad; el resto se toma siempre del catálogo actual.
let carrito = leerCarrito()
  .filter(i => i && porCodigo.has(i.codigo) && Number(i.cantidad) > 0)
  .map(i => ({ codigo: i.codigo, cantidad: Math.min(999, Math.floor(Number(i.cantidad))) }));

/* ---------- tema ---------- */
function aplicarTema(t){
  document.body.setAttribute('data-theme', t);
  $('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
}
function cambiarTema(){
  const t = document.body.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  aplicarTema(t);
  try { localStorage.setItem(KEY_TEMA, t); } catch(e){}
}

/* ---------- catálogo ---------- */
function llenarCategorias(){
  const sel = $('catSelect');
  const cats = [];
  catalogo.forEach(p => { if (!cats.includes(p.categoria)) cats.push(p.categoria); });
  const orden = Object.keys(SECCIONES);
  cats.sort((a, b) => {
    const ia = orden.indexOf(a), ib = orden.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
  });
  cats.forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = c;
    sel.appendChild(o);
  });
  return cats;
}

function tarjeta(p){
  const stock = Number(p.stock) || 0;
  let etiqueta = '';
  if (p.categoria !== 'RECARGAS') {
    etiqueta = stock > 0
      ? '<span class="stock ok">Disponible</span>'
      : '<span class="stock ask">Consultar disponibilidad</span>';
  }
  return `<article class="product-card">
    <div>
      <img src="fotos/${encodeURIComponent(p.codigo)}.jpg" alt="${esc(p.nombre)}" loading="lazy" width="250" height="180">
      <div class="product-info">
        <span class="product-cat">${esc(p.categoria)}</span>
        <h3>${esc(p.nombre)}</h3>
        ${p.descripcion ? `<p class="product-desc">${esc(p.descripcion)}</p>` : ''}
        ${etiqueta}
      </div>
    </div>
    <button class="btn btn-r js-add" type="button" data-codigo="${esc(p.codigo)}">Añadir a cotización</button>
  </article>`;
}

function renderProductos(){
  // Cada palabra escrita debe aparecer en el nombre, código o descripción (en cualquier orden).
  const palabras = norm($('searchProd').value.trim()).split(/\s+/).filter(Boolean);
  const cat = $('catSelect').value;
  const lista = catalogo.filter(p => {
    if (cat && p.categoria !== cat) return false;
    const texto = norm(p.nombre + ' ' + p.codigo + ' ' + (p.descripcion || ''));
    return palabras.every(w => texto.includes(w));
  });

  const cont = $('contenedorSecciones');
  if (!catalogo.length) {
    cont.innerHTML = '<p class="empty">No se pudo cargar el catálogo. Recarga la página o escríbenos por WhatsApp.</p>';
    $('resultCount').textContent = '';
    return;
  }
  if (!lista.length) {
    cont.innerHTML = '<p class="empty">No encontramos productos con esa búsqueda. Prueba con otra palabra o escríbenos por WhatsApp.</p>';
    $('resultCount').textContent = '0 productos';
    return;
  }

  const grupos = new Map();
  lista.forEach(p => {
    if (!grupos.has(p.categoria)) grupos.set(p.categoria, []);
    grupos.get(p.categoria).push(p);
  });
  const orden = Object.keys(SECCIONES);
  const claves = [...grupos.keys()].sort((a, b) => {
    const ia = orden.indexOf(a), ib = orden.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
  });

  cont.innerHTML = claves.map(k =>
    `<h2 class="section-title">${esc(SECCIONES[k] || k)}</h2>
     <div class="products-grid">${grupos.get(k).map(tarjeta).join('')}</div>`
  ).join('');
  $('resultCount').textContent = lista.length + (lista.length === 1 ? ' producto' : ' productos');
}

/* ---------- carrito ---------- */
function totalUnidades(){ return carrito.reduce((s, i) => s + i.cantidad, 0); }

function actualizarCarritoUI(){
  const total = totalUnidades();
  $('cartCount').textContent = total;
  $('cartTotal').textContent = total + (total === 1 ? ' producto' : ' productos');
  $('cartClear').style.display = carrito.length ? '' : 'none';

  const lista = $('cartItemsList');
  if (!carrito.length) {
    lista.innerHTML = '<p class="cart-empty">Tu lista está vacía.<br>Toca «Añadir a cotización» en los productos que necesites.</p>';
    return;
  }
  lista.innerHTML = carrito.map(i => {
    const p = porCodigo.get(i.codigo);
    return `<div class="cart-item">
      <div class="cart-item-details">
        <h4>${esc(p.nombre)}</h4>
        <small>${esc(p.codigo)}</small>
        <div class="qty-controls">
          <button class="qty-btn" type="button" data-accion="menos" data-codigo="${esc(i.codigo)}" aria-label="Quitar una unidad de ${esc(p.nombre)}">−</button>
          <span aria-live="polite">${i.cantidad}</span>
          <button class="qty-btn" type="button" data-accion="mas" data-codigo="${esc(i.codigo)}" aria-label="Agregar una unidad de ${esc(p.nombre)}">+</button>
        </div>
      </div>
      <button class="btn btn-outline" type="button" style="padding:4px 8px;font-size:.75rem" data-accion="quitar" data-codigo="${esc(i.codigo)}" aria-label="Eliminar ${esc(p.nombre)}">Eliminar</button>
    </div>`;
  }).join('');
}

function persistir(){ guardarCarrito(); actualizarCarritoUI(); }

function cambiarCantidad(codigo, delta){
  const item = carrito.find(i => i.codigo === codigo);
  if (!item) return;
  item.cantidad = Math.min(999, item.cantidad + delta);
  if (item.cantidad <= 0) carrito = carrito.filter(i => i.codigo !== codigo);
  persistir();
}

function agregar(codigo){
  const p = porCodigo.get(codigo);
  if (!p) return;
  const item = carrito.find(i => i.codigo === codigo);
  if (item) item.cantidad = Math.min(999, item.cantidad + 1);
  else carrito.push({ codigo: codigo, cantidad: 1 });
  persistir();
  aviso(p.nombre + ' añadido a tu lista');
}

let toastTimer;
function aviso(texto){
  const t = $('toast');
  t.textContent = texto;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

let ultimoFoco = null;
function abrirCarrito(){
  ultimoFoco = document.activeElement;
  $('cartModal').classList.add('open');
  $('cartModal').setAttribute('aria-hidden', 'false');
  $('cartOverlay').classList.add('open');
  $('cartClose').focus();
}
function cerrarCarrito(){
  $('cartModal').classList.remove('open');
  $('cartModal').setAttribute('aria-hidden', 'true');
  $('cartOverlay').classList.remove('open');
  if (ultimoFoco && ultimoFoco.focus) ultimoFoco.focus();
}

/* ---------- envío por WhatsApp ---------- */
function enviarCotizacion(){
  const err = $('formError');
  err.textContent = '';
  if (!carrito.length) { err.textContent = 'Agrega al menos un producto a tu lista.'; return; }

  const nombre = $('clientName').value.trim();
  const telefono = $('clientPhone').value.trim();
  const ruc = $('clientRuc').value.trim();
  const correo = $('clientEmail').value.trim();
  const direccion = $('clientAddress').value.trim();

  if (!nombre) { err.textContent = 'Escribe tu nombre o el de tu empresa.'; $('clientName').focus(); return; }
  if (!/\d{7,}/.test(telefono.replace(/[\s\-().+]/g, ''))) { err.textContent = 'Escribe un teléfono válido para contactarte.'; $('clientPhone').focus(); return; }
  if (correo && !$('clientEmail').checkValidity()) { err.textContent = 'El correo no parece válido. Revísalo o déjalo vacío.'; $('clientEmail').focus(); return; }

  const lineas = ['*SOLICITUD DE COTIZACIÓN - ATESEG*', '-----------------------------------',
    '*Cliente / Empresa:* ' + nombre,
    '*Teléfono:* ' + telefono];
  if (ruc) lineas.push('*RUC / Cédula:* ' + ruc);
  if (correo) lineas.push('*Correo:* ' + correo);
  if (direccion) lineas.push('*Ubicación:* ' + direccion);
  lineas.push('-----------------------------------', '*DETALLE DE PRODUCTOS:*');
  carrito.forEach(i => {
    const p = porCodigo.get(i.codigo);
    lineas.push('- ' + i.cantidad + 'x ' + p.nombre + ' (' + p.codigo + ')');
  });
  lineas.push('*Total de unidades:* ' + totalUnidades());

  const url = 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(lineas.join('\n'));
  window.open(url, '_blank', 'noopener');
}

/* ---------- eventos ---------- */
function iniciar(){
  let tema = 'light';
  try { tema = localStorage.getItem(KEY_TEMA) === 'dark' ? 'dark' : 'light'; } catch(e){}
  aplicarTema(tema);

  llenarCategorias();
  renderProductos();
  actualizarCarritoUI();

  $('themeBtn').addEventListener('click', cambiarTema);
  $('cartBtn').addEventListener('click', abrirCarrito);
  $('cartClose').addEventListener('click', cerrarCarrito);
  $('cartOverlay').addEventListener('click', cerrarCarrito);
  $('sendBtn').addEventListener('click', enviarCotizacion);
  $('cartClear').addEventListener('click', () => {
    if (confirm('¿Vaciar toda tu lista de cotización?')) { carrito = []; persistir(); }
  });
  $('searchProd').addEventListener('input', renderProductos);
  $('catSelect').addEventListener('change', renderProductos);

  $('contenedorSecciones').addEventListener('click', e => {
    const b = e.target.closest('.js-add');
    if (b) agregar(b.dataset.codigo);
  });
  // Si una foto no existe, se muestra el logo (una sola vez, sin bucles).
  $('contenedorSecciones').addEventListener('error', e => {
    const img = e.target;
    if (img.tagName === 'IMG' && !img.dataset.fallback) {
      img.dataset.fallback = '1';
      img.src = 'logo-ateseg.jpg';
    }
  }, true);

  $('cartItemsList').addEventListener('click', e => {
    const b = e.target.closest('[data-accion]');
    if (!b) return;
    const cod = b.dataset.codigo;
    if (b.dataset.accion === 'mas') cambiarCantidad(cod, 1);
    else if (b.dataset.accion === 'menos') cambiarCantidad(cod, -1);
    else if (b.dataset.accion === 'quitar') {
      carrito = carrito.filter(i => i.codigo !== cod);
      persistir();
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && $('cartModal').classList.contains('open')) cerrarCarrito();
  });
}

document.addEventListener('DOMContentLoaded', iniciar);
})();
</script>
</body>
</html>
